name: Add project
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: add-project-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  add:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'add-project')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - id: form
        # The issue body is untrusted. It stays in an environment variable and never reaches the shell.
        run: uv run --no-project --python 3.12 python scripts/add_from_issue.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ERROR_FILE: ${{ runner.temp }}/error.md
      - name: Report problems
        if: steps.form.outputs.ok == 'false'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/error.md"
      - name: Open the pull request
        if: steps.form.outputs.ok == 'true'
        env:
          SLUG: ${{ steps.form.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="add/$SLUG"
          git switch -c "$branch"
          git add "data/projects/$SLUG.json"
          git commit -m "Add $SLUG"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --head "$branch" --base master --title "Add $SLUG" --body "Closes #$ISSUE_NUMBER"
          fi
