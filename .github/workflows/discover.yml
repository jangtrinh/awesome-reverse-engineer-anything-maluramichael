# Weekly search for projects worth reviewing. Results go to one issue, nothing is added automatically.
name: Discover
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project --python 3.12 python scripts/discover.py "$RUNNER_TEMP/candidates.md"
      - name: Update the candidates issue
        run: |
          number=$(gh issue list --label candidates --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/candidates.md"
          else
            gh issue create --title "Candidates from the weekly search" --label candidates --body-file "$RUNNER_TEMP/candidates.md"
          fi
