name: Links
on:
  schedule:
    - cron: "11 6 * * 3"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --accept 200,206,403,429 README.md
          output: lychee.md
          fail: false
      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        run: |
          number=$(gh issue list --label broken-links --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee.md
          else
            gh issue create --title "Broken links" --label broken-links --body-file lychee.md
          fi
